name: CI/CD Task Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION: europe-west1
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/taskmanager-backend
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/taskmanager-frontend

jobs:
  # ---------------------------------------------------------------
  # 1) Build & tests du backend Spring Boot
  # ---------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build et tests (profil H2)
        working-directory: ./backend
        run: mvn -B clean verify

  # ---------------------------------------------------------------
  # 2) Build & lint du frontend React
  # ---------------------------------------------------------------
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: ./frontend
        run: npm ci

      - name: Build de production
        working-directory: ./frontend
        run: npm run build

  # ---------------------------------------------------------------
  # 3) Build des images Docker + déploiement GCP Cloud Run
  #    (ne s'exécute que sur push vers main, après succès des tests)
  # ---------------------------------------------------------------
  build-and-deploy:
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authentification GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurer gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configurer Docker pour GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & push image backend
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} -t $BACKEND_IMAGE:latest ./backend
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $BACKEND_IMAGE:latest

      - name: Build & push image frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.BACKEND_PUBLIC_URL }}/api \
            -t $FRONTEND_IMAGE:${{ github.sha }} -t $FRONTEND_IMAGE:latest ./frontend
          docker push $FRONTEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:latest

      - name: Déployer le backend sur Cloud Run
        run: |
          gcloud run deploy taskmanager-backend \
            --image $BACKEND_IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars SPRING_PROFILES_ACTIVE=mysql,DB_HOST=${{ secrets.DB_HOST }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}

      - name: Déployer le frontend sur Cloud Run
        run: |
          gcloud run deploy taskmanager-frontend \
            --image $FRONTEND_IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated
