spring.application.name=task-manager-backend

# ---- Profil actif ----
# Utiliser "mysql" en production/local avec Docker, "h2" pour tests rapides sans base externe
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

server.port=${PORT:8080}

# ---- JWT ----
jwt.secret=${JWT_SECRET:changeThisSecretKeyForProductionUseAtLeast256BitsLongPlease}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
